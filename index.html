<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GTA Vice City</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;}
#c{display:block;position:fixed;top:0;left:0;}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;font-family:'Arial Black',sans-serif;}
#t{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#ff88dd;font-size:22px;font-weight:900;text-shadow:0 0 18px #ff44aa,3px 3px 0#000;letter-spacing:5px;}
#m{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:17px;font-weight:bold;background:rgba(0,0,0,.65);padding:10px 22px;border-radius:8px;border:1px solid #ff44aa55;text-align:center;}
#ctrl{position:absolute;bottom:16px;left:16px;color:#eee;font-size:12px;line-height:1.9;background:rgba(0,0,0,.6);padding:9px 14px;border-radius:8px;border-left:3px solid #ff44aa;}
#badge{position:absolute;bottom:16px;right:16px;color:#ff88dd;font-size:13px;text-align:right;text-shadow:2px 2px 4px #000;}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:#ff88dd;display:none;box-shadow:0 0 5px #ff44aa;}
#dbg{display:none;}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<div id="hud">
  <div id="t">⚡ VICE CITY ⚡</div>
  <div id="m">🖱 Click to play</div>
  <div id="cross"></div>
  <div id="ctrl"><b style="color:#ff88dd">CONTROLS</b><br>WASD — Move<br>Shift — Sprint<br>Space — Jump<br>Mouse — Camera</div>
  <div id="badge">🌴 VICE CITY<br><span style="font-size:10px;color:#ffaa88">Est. 1986</span></div>
  <div id="dbg"></div>
</div>
<script>
const dbg = document.getElementById('dbg');
const C = document.getElementById('c');

const gl = C.getContext('webgl', {antialias:true, depth:true});
if(!gl){ document.getElementById('m').textContent='WebGL not supported'; }

gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);

function getSize(){
  // Try every source; Claude artifact iframes have innerHeight=0
  let w = window.innerWidth || 0;
  let h = window.innerHeight || 0;
  if(h < 10){
    // Try parent frame
    try{ h = window.parent.innerHeight || 0; w = window.parent.innerWidth || w; }catch(e){}
  }
  if(h < 10) h = document.documentElement.clientHeight || 0;
  if(w < 10) w = document.documentElement.clientWidth || 0;
  if(w < 10) w = screen.width || 800;
  if(h < 10) h = screen.height || 600;
  if(w < 10) w = 800;
  if(h < 10) h = 600;
  return {w, h};
}
function forceResize(){
  const {w, h} = getSize();
  C.width = w;
  C.height = h;
  C.style.width = w+'px';
  C.style.height = h+'px';
  gl.viewport(0,0,w,h);
}
forceResize();
setTimeout(forceResize, 100);
setTimeout(forceResize, 500);
setTimeout(forceResize, 1500);
window.addEventListener('resize', forceResize);

const VS=`
attribute vec3 aP;attribute vec3 aN;attribute vec2 aU;
uniform mat4 uMVP;uniform mat4 uM;
varying vec3 vN;varying vec3 vW;varying vec2 vU;
void main(){
  vec4 w=uM*vec4(aP,1.);
  vW=w.xyz;vN=normalize(mat3(uM)*aN);vU=aU;
  gl_Position=uMVP*vec4(aP,1.);
}`;
const FS=`
precision mediump float;
varying vec3 vN;varying vec3 vW;varying vec2 vU;
uniform vec3 uC;uniform vec3 uE;uniform vec3 uS;uniform vec3 uK;
uniform float uFN;uniform float uFF;uniform vec3 uFC;
uniform sampler2D uT;uniform int uUT;
void main(){
  vec3 n=normalize(vN);
  float d=max(dot(n,normalize(uS)),0.);
  vec3 c=uC;
  float amb=.45,dif=1.1;
  if(uUT==1){
    vec2 q=clamp(vU,0.0,1.0);
    vec2 tc=vec2(0.10+q.x*0.80, 0.06+q.y*0.68);
    float r=length(vec2((vU.x-.5)/.44,(vU.y-.5)/.56));
    float m=smoothstep(1.0,.70,r);
    c=mix(uC,texture2D(uT,tc).rgb,m);
    amb=.86;dif=.40;
  }
  vec3 col=c*amb+c*d*dif+uE;
  float fog=clamp((length(vW-uK)-uFN)/(uFF-uFN),0.,1.);
  gl_FragColor=vec4(mix(col,uFC,fog*.82),1.);
}`;

function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)){const e=gl.getShaderInfoLog(x);console.error(e);document.getElementById('m').textContent='SHADER ERR: '+e;return x;}return x;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){const e=gl.getProgramInfoLog(prog);console.error(e);document.getElementById('m').textContent='LINK ERR: '+e;}
gl.useProgram(prog);

const aP=gl.getAttribLocation(prog,'aP'),aN_=gl.getAttribLocation(prog,'aN'),aU_=gl.getAttribLocation(prog,'aU');
const uMVP=gl.getUniformLocation(prog,'uMVP'),uM_=gl.getUniformLocation(prog,'uM');
const uC_=gl.getUniformLocation(prog,'uC'),uE_=gl.getUniformLocation(prog,'uE');
const uS_=gl.getUniformLocation(prog,'uS'),uK_=gl.getUniformLocation(prog,'uK');
const uFN_=gl.getUniformLocation(prog,'uFN'),uFF_=gl.getUniformLocation(prog,'uFF');
const uFC_=gl.getUniformLocation(prog,'uFC'),uT_=gl.getUniformLocation(prog,'uT'),uUT_=gl.getUniformLocation(prog,'uUT');

// Face texture
const faceT=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,faceT);
function texParams(){
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
}
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([200,150,110,255]));
texParams();
const img=new Image();
img.onload=()=>{
  gl.bindTexture(gl.TEXTURE_2D,faceT);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  texParams();
};
img.onerror=()=>{document.getElementById('m').textContent='FACE IMG ERROR';};

// Geometry
function mkBuf(verts,idx){
  const vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
  const ibo=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
  return{vbo,ibo,n:idx.length};
}
function boxG(w,h,d){
  const W=w/2,H=h/2,D=d/2;
  const V=[],I=[];
  const F=[
    [0,0,1, -W,-H,D, W,-H,D, W,H,D, -W,H,D],
    [0,0,-1, W,-H,-D,-W,-H,-D,-W,H,-D,W,H,-D],
    [1,0,0, W,-H,D,W,-H,-D,W,H,-D,W,H,D],
    [-1,0,0,-W,-H,-D,-W,-H,D,-W,H,D,-W,H,-D],
    [0,1,0,-W,H,D,W,H,D,W,H,-D,-W,H,-D],
    [0,-1,0,-W,-H,-D,W,-H,-D,W,-H,D,-W,-H,D]
  ];
  const UV=[[0,0],[1,0],[1,1],[0,1]];
  F.forEach(([nx,ny,nz,...pts])=>{
    const b=V.length/8;
    for(let i=0;i<4;i++) V.push(pts[i*3],pts[i*3+1],pts[i*3+2],nx,ny,nz,...UV[i]);
    I.push(b,b+1,b+2,b,b+2,b+3);
  });
  return mkBuf(V,I);
}
function sphG(r,s){
  const V=[],I=[];
  for(let i=0;i<=s;i++){const p=Math.PI*i/s;
    for(let j=0;j<=s*2;j++){const t=2*Math.PI*j/(s*2);
      const x=Math.sin(p)*Math.cos(t),y=Math.cos(p),z=Math.sin(p)*Math.sin(t);
      V.push(r*x,r*y,r*z,x,y,z,j/(s*2),i/s);
    }
  }
  for(let i=0;i<s;i++)for(let j=0;j<s*2;j++){
    const a=i*(s*2+1)+j;I.push(a,a+1,a+s*2+1,a+1,a+s*2+2,a+s*2+1);
  }
  return mkBuf(V,I);
}
function plaG(w,d){const W=w/2,D=d/2;
  // Wind the triangles counter-clockwise seen from above, so the lit face
  // is the one you stand on and CULL_FACE does not eat the ground.
  return mkBuf([-W,0,-D,0,1,0,0,0,W,0,-D,0,1,0,1,0,W,0,D,0,1,0,1,1,-W,0,D,0,1,0,0,1],[0,2,1,0,3,2]);
}
function cylG(r,h,s){const V=[],I=[];
  for(let i=0;i<=s;i++){const a=2*Math.PI*i/s,nx=Math.cos(a),nz=Math.sin(a);
    V.push(r*.7*nx,-h/2,r*.7*nz,nx,0,nz,i/s,1);
    V.push(r*nx,h/2,r*nz,nx,0,nz,i/s,0);
  }
  for(let i=0;i<s;i++){const a=i*2,b=(i+1)*2;I.push(a,a+1,b+1,a,b+1,b);}
  return mkBuf(V,I);
}

// Head sphere: UV laid out so the photo sits on the FRONT (-Z) of the skull.
// u runs 0.5 at the nose, 0/1 at +-70 deg; v runs 0 at the crown, 1 under the chin.
function headG(r,s){const V=[],I=[];
  const SPREAD=90/70;
  for(let i=0;i<=s;i++){const p=Math.PI*i/s;
    for(let j=0;j<=s*2;j++){
      const t=Math.PI*.5+2*Math.PI*j/(s*2);
      const x=Math.sin(p)*Math.cos(t),y=Math.cos(p),z=Math.sin(p)*Math.sin(t);
      const u=.5+(j/s-1)*SPREAD, v=(p/Math.PI-.12)/.76;
      V.push(r*x,r*y,r*z,x,y,z,u,v);
    }
  }
  for(let i=0;i<s;i++)for(let j=0;j<s*2;j++){
    const a=i*(s*2+1)+j;I.push(a,a+1,a+s*2+1,a+1,a+s*2+2,a+s*2+1);
  }
  return mkBuf(V,I);
}
const BOX=boxG(1,1,1),SPH=sphG(.5,10),PLA=plaG(1,1),CYL=cylG(.5,1,10),CYLT=cylG(.12,1,8);
const HEAD=headG(.5,26);

function bind(m){
  gl.bindBuffer(gl.ARRAY_BUFFER,m.vbo);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,m.ibo);
  gl.vertexAttribPointer(aP,3,gl.FLOAT,false,32,0);gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aN_,3,gl.FLOAT,false,32,12);gl.enableVertexAttribArray(aN_);
  gl.vertexAttribPointer(aU_,2,gl.FLOAT,false,32,24);gl.enableVertexAttribArray(aU_);
}

// Mat4 helpers
function m4i(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;}
function mul(o,a,b){for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}
function persp(o,fov,asp,n,f){
  const t=1/Math.tan(fov/2),q=1/(n-f);
  o.fill(0);o[0]=t/asp;o[5]=t;o[10]=(f+n)*q;o[11]=-1;o[14]=2*f*n*q;return o;
}
function lookAt(o,ex,ey,ez,cx,cy,cz){
  let z0=ex-cx,z1=ey-cy,z2=ez-cz;
  let l=Math.sqrt(z0*z0+z1*z1+z2*z2);if(l)l=1/l;z0*=l;z1*=l;z2*=l;
  // x = cross([0,1,0], z)
  let x0=z2,x1=0,x2=-z0;
  l=Math.sqrt(x0*x0+x1*x1+x2*x2);if(l)l=1/l;x0*=l;x2*=l;
  // y = cross(z, x)
  const y0=z1*x2-z2*x1,y1=z2*x0-z0*x2,y2=z0*x1-z1*x0;
  o[0]=x0;o[1]=y0;o[2]=z0;o[3]=0;
  o[4]=x1;o[5]=y1;o[6]=z1;o[7]=0;
  o[8]=x2;o[9]=y2;o[10]=z2;o[11]=0;
  o[12]=-(x0*ex+x1*ey+x2*ez);
  o[13]=-(y0*ex+y1*ey+y2*ez);
  o[14]=-(z0*ex+z1*ey+z2*ez);o[15]=1;return o;
}
function trs(o,tx,ty,tz,ry,sx,sy,sz){
  const c=Math.cos(ry),s=Math.sin(ry);
  o[0]=c*sx;o[1]=0;o[2]=-s*sx;o[3]=0;
  o[4]=0;o[5]=sy;o[6]=0;o[7]=0;
  o[8]=s*sz;o[9]=0;o[10]=c*sz;o[11]=0;
  o[12]=tx;o[13]=ty;o[14]=tz;o[15]=1;return o;
}

// World
const WORLD=[
  // ground
  {g:PLA,p:[0,0,0],s:[120,1,120],r:0,c:[.22,.22,.24]},
  {g:PLA,p:[-18,.02,0],s:[6,1,100],r:0,c:[.60,.58,.54]},
  {g:PLA,p:[18,.02,0],s:[6,1,100],r:0,c:[.60,.58,.54]},
  ...[-24,-16,-8,0,8,16,24].map(z=>({g:PLA,p:[0,.04,z],s:[.5,1,3.5],r:0,c:[.95,.95,.95]})),
  // buildings
  {g:BOX,p:[-28,9,-22],s:[12,18,14],r:0,c:[.82,.64,.44]},
  {g:BOX,p:[-30,13,5],s:[10,26,13],r:0,c:[.74,.60,.82]},
  {g:BOX,p:[-29,7,28],s:[12,14,16],r:0,c:[.42,.68,.84]},
  {g:BOX,p:[28,11,-18],s:[12,22,14],r:0,c:[.90,.77,.36]},
  {g:BOX,p:[30,8,8],s:[11,16,13],r:0,c:[.90,.50,.36]},
  {g:BOX,p:[28,10,30],s:[14,20,14],r:0,c:[.52,.78,.62]},
  // neons
  {g:BOX,p:[-21,10,-22],s:[3,.45,.1],r:0,c:[1,.2,.85],e:[.6,.1,.45]},
  {g:BOX,p:[21,8,-18],s:[3,.45,.1],r:0,c:[.2,.85,1],e:[.1,.45,.6]},
  {g:BOX,p:[-21,15,5],s:[3,.45,.1],r:0,c:[1,.9,.2],e:[.6,.5,.1]},
  {g:BOX,p:[21,12,8],s:[3,.45,.1],r:0,c:[1,.4,.2],e:[.6,.2,.1]},
  // ocean
  {g:PLA,p:[0,-.2,65],s:[250,1,80],r:0,c:[.08,.35,.72]},
];

// Palms
[[-14,0,-28],[-14,0,-13],[-14,0,2],[-14,0,17],[-14,0,32],
 [14,0,-23],[14,0,-8],[14,0,7],[14,0,22],[14,0,37]].forEach(([x,,z])=>{
  WORLD.push({g:CYLT,p:[x,3.2,z],s:[1,6.4,1],r:0,c:[.52,.38,.08]});
  for(let a=0;a<6;a++){const ag=a/6*Math.PI*2;
    WORLD.push({g:BOX,p:[x+Math.cos(ag)*1.4,6.8,z+Math.sin(ag)*1.4],s:[2.8,.1,.6],r:ag,c:[.08,.52,.15]});}
});
// Lamps
[[-14,0,-20],[-14,0,4],[-14,0,28],[14,0,-16],[14,0,8],[14,0,32]].forEach(([x,,z])=>{
  WORLD.push({g:CYLT,p:[x,4,z],s:[1,8,1],r:0,c:[.5,.5,.55]});
  WORLD.push({g:BOX,p:[x+.8,7.9,z],s:[1.6,.25,.25],r:0,c:[.4,.4,.45]});
  WORLD.push({g:BOX,p:[x+1.6,7.7,z],s:[.38,.38,.38],r:0,c:[1,1,.7],e:[.7,.7,.2]});
});

// Player
const P={x:0,y:1.6,z:4,vx:0,vy:0,vz:0,ry:0,grnd:false,rad:.38,ht:1.85};
const K={};
window.addEventListener('keydown',e=>{K[e.code]=1;if('WASD Space ArrowUp ArrowDown ArrowLeft ArrowRight'.includes(e.code.replace('Key','')))e.preventDefault();});
window.addEventListener('keyup',e=>{K[e.code]=0;});

let yaw=0,pitch=.3,locked=false,jp=false;
const msgEl=document.getElementById('m'),crEl=document.getElementById('cross');
C.addEventListener('click',()=>C.requestPointerLock());
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===C;
  msgEl.style.display=locked?'none':'block';
  crEl.style.display=locked?'block':'none';
});
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.003;pitch=Math.max(.06,Math.min(1.3,pitch+e.movementY*.003));});

// Collision walls
const WALLS=[
  {mn:[-36,-1,-32],mx:[-22,22,-16]},{mn:[-36,-1,-2],mx:[-25,28,12]},
  {mn:[-36,-1,20],mx:[-23,16,36]},{mn:[22,-1,-25],mx:[35,23,-12]},
  {mn:[24,-1,2],mx:[36,18,15]},{mn:[21,-1,23],mx:[36,22,38]},
  {mn:[-70,-1,-70],mx:[70,1,-66]},{mn:[-70,-1,66],mx:[70,1,70]},
  {mn:[-70,-1,-70],mx:[-66,1,70]},{mn:[66,-1,-70],mx:[70,1,70]},
];
function pAABB(){return{mn:[P.x-P.rad,P.y,P.z-P.rad],mx:[P.x+P.rad,P.y+P.ht,P.z+P.rad]};}
function ov(a,b){return a.mn[0]<b.mx[0]&&a.mx[0]>b.mn[0]&&a.mn[1]<b.mx[1]&&a.mx[1]>b.mn[1]&&a.mn[2]<b.mx[2]&&a.mx[2]>b.mn[2];}
function collide(){
  for(const w of WALLS){const a=pAABB();if(!ov(a,w))continue;
    const ox=Math.min(a.mx[0]-w.mn[0],w.mx[0]-a.mn[0]);
    const oy=Math.min(a.mx[1]-w.mn[1],w.mx[1]-a.mn[1]);
    const oz=Math.min(a.mx[2]-w.mn[2],w.mx[2]-a.mn[2]);
    if(oy<ox&&oy<oz){if(a.mn[1]<w.mn[1]){P.y-=oy;P.vy=Math.min(P.vy,0);}else{P.y+=oy;P.grnd=true;P.vy=0;}}
    else if(ox<oz){P.x+=(a.mn[0]+a.mx[0]<w.mn[0]+w.mx[0])?-ox:ox;P.vx=0;}
    else{P.z+=(a.mn[2]+a.mx[2]<w.mn[2]+w.mx[2])?-oz:oz;P.vz=0;}
  }
}
function step(dt){
  P.vy-=22*dt;P.grnd=false;
  if(P.y<=1.6){P.y=1.6;P.vy=0;P.grnd=true;}
  const sp=(K.ShiftLeft||K.ShiftRight)?12:6;
  const sy=Math.sin(yaw),cy=Math.cos(yaw);
  let mx=0,mz=0;
  if(K.KeyW||K.ArrowUp){mx-=sy;mz-=cy;}
  if(K.KeyS||K.ArrowDown){mx+=sy;mz+=cy;}
  if(K.KeyA||K.ArrowLeft){mx+=cy;mz-=sy;}
  if(K.KeyD||K.ArrowRight){mx-=cy;mz+=sy;}
  const ml=Math.sqrt(mx*mx+mz*mz);
  if(ml>0){mx/=ml;mz/=ml;let d=Math.atan2(mx,mz)-P.ry;d=((d+Math.PI)%(2*Math.PI))-Math.PI;P.ry+=d*Math.min(dt*14,1);}
  P.vx=mx*sp;P.vz=mz*sp;
  if(K.Space&&!jp&&P.grnd){P.vy=9;P.grnd=false;}
  jp=!!K.Space;
  P.x+=P.vx*dt;P.y+=P.vy*dt;P.z+=P.vz*dt;
  collide();
}

// Render
const proj=m4i(),view=m4i(),vp=m4i(),mvp=m4i(),mod=m4i();
const SUN=[.55,.82,.4],FOG=[.93,.52,.35];

function draw(g,tx,ty,tz,ry,sx,sy_,sz,col,em,ut=0){
  trs(mod,tx,ty,tz,ry,sx,sy_,sz);
  mul(mvp,vp,mod);
  bind(g);
  gl.uniformMatrix4fv(uMVP,false,mvp);
  gl.uniformMatrix4fv(uM_,false,mod);
  gl.uniform3fv(uC_,col);
  const f=.82+Math.sin(performance.now()*.003)*.18;
  gl.uniform3fv(uE_,em?[em[0]*f,em[1]*f,em[2]*f]:[0,0,0]);
  gl.uniform1i(uUT_,ut);
  if(ut){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,faceT);gl.uniform1i(uT_,0);}
  gl.drawElements(gl.TRIANGLES,g.n,gl.UNSIGNED_SHORT,0);
}

function drawBody(now){
  const {x,y,z,ry}=P;
  const mv=P.vx*P.vx+P.vz*P.vz>.2,sw=mv?Math.sin(now*.006)*.32:0;
  function part(ox,oy,oz,sx,sy_,sz,col,pry=0,ut=0){
    const cs=Math.cos(ry),sn=Math.sin(ry);
    const wx=x+cs*ox+sn*oz,wy=y+oy,wz=z-sn*ox+cs*oz;
    draw(ut?HEAD:BOX,wx,wy,wz,ry+pry,sx,sy_,sz,col,null,ut);
  }
  part(0,1.2,0, .52,.72,.28, [.88,.28,.08]); // torso
  part(0,1.74,0, .15,.2,.15, [.90,.72,.54]);  // neck
  part(0,2.12,0, .9,.9,.9, [.13,.09,.07], 0, 1); // head: photo on the front, hair elsewhere
  part(-.36,1.28+sw*.5,0, .16,.44,.16, [.88,.28,.08]); // l arm up
  part(-.36,.88+sw*.3,0, .14,.32,.14, [.90,.72,.54]); // l forearm
  part(.36,1.28-sw*.5,0, .16,.44,.16, [.88,.28,.08]); // r arm up
  part(.36,.88-sw*.3,0, .14,.32,.14, [.90,.72,.54]); // r forearm
  part(-.16,.74+sw*.4,0, .19,.52,.19, [.14,.14,.40]); // l thigh
  part(-.16,.32+sw*.2,.04, .17,.42,.17, [.14,.14,.40]); // l shin
  part(-.16,.1+sw*.15,.07, .20,.12,.30, [.06,.06,.06]); // l shoe
  part(.16,.74-sw*.4,0, .19,.52,.19, [.14,.14,.40]); // r thigh
  part(.16,.32-sw*.2,.04, .17,.42,.17, [.14,.14,.40]); // r shin
  part(.16,.1-sw*.15,.07, .20,.12,.30, [.06,.06,.06]); // r shoe
}

let last=0;
function frame(now){
  if(C.width<10||C.height<10) forceResize();
  const dt=Math.min((now-last)*.001,.05);last=now;
  step(dt);

  const cpx=P.x+Math.sin(yaw)*6.5*Math.cos(pitch);
  const cpy=P.y+2.8+Math.sin(pitch)*6.5;
  const cpz=P.z+Math.cos(yaw)*6.5*Math.cos(pitch);

  gl.clearColor(FOG[0],FOG[1],FOG[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  persp(proj,75*Math.PI/180,C.width/C.height,.1,500);
  lookAt(view,cpx,cpy,cpz,P.x,P.y+1.3,P.z);
  mul(vp,proj,view);

  gl.uniform3fv(uS_,SUN);gl.uniform3fv(uK_,[cpx,cpy,cpz]);
  gl.uniform1f(uFN_,60);gl.uniform1f(uFF_,220);gl.uniform3fv(uFC_,FOG);

  for(const o of WORLD) draw(o.g,o.p[0],o.p[1],o.p[2],o.r,o.s[0],o.s[1],o.s[2],o.c,o.e);
  drawBody(now);

  if(C.height < 10) forceResize();
  dbg.textContent=`${C.width}x${C.height} | pos:(${P.x.toFixed(1)},${P.y.toFixed(1)},${P.z.toFixed(1)}) | iw:${window.innerWidth} ih:${window.innerHeight} sh:${screen.height}`;
  requestAnimationFrame(frame);
}

forceResize();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
</script>
</body>
</html>
